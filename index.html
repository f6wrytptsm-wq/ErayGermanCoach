<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eray German Coach</title>

<style>
body{
font-family:Arial,sans-serif;
background:#f4f4f4;
padding:20px;
text-align:center;
}

.container{
max-width:800px;
margin:auto;
background:white;
padding:20px;
border-radius:15px;
box-shadow:0 0 10px rgba(0,0,0,0.15);
}

button{
padding:10px 15px;
margin:4px;
font-size:16px;
cursor:pointer;
}

#sentence{
font-size:28px;
font-weight:bold;
margin:25px 0;
}

input{
width:90%;
padding:12px;
font-size:18px;
}

#result{
margin-top:15px;
font-size:18px;
font-weight:bold;
}

.stats{
margin-top:20px;
font-size:18px;
line-height:2;
}

.mode{
margin-bottom:15px;
}
</style>
</head>

<body>

<div class="container">

<h1>🇩🇪 Eray German Coach</h1>

<div class="mode">

<button onclick="setMode('de-tr')">
🇩🇪 → 🇹🇷
</button>

<button onclick="setMode('tr-de')">
🇹🇷 → 🇩🇪
</button>

</div>

<div>

<button onclick="loadLevel('a2.txt')">A2</button>
<button onclick="loadLevel('a2plus.txt')">A2+</button>
<button onclick="loadLevel('b1.txt')">B1</button>
<button onclick="loadLevel('b1plus.txt')">B1+</button>
<button onclick="loadLevel('b2.txt')">B2</button>
<button onclick="loadLevel('b2plus.txt')">B2+</button>

</div>

<h3 id="currentLevel">
Seviye: A2
</h3>

<h3 id="currentMode">
Mod: 🇩🇪 → 🇹🇷
</h3>

<div id="sentence"></div>

<input
id="answer"
placeholder="Cevabını yaz">

<br><br>

<button onclick="checkAnswer()">
✅ Kontrol Et
</button>

<div id="result"></div>

<div class="stats">

Puan:
<span id="puan">0</span>

<br>

Doğru:
<span id="dogru">0</span>

<br>

Yanlış:
<span id="yanlis">0</span>

<br>

Başarı:
<span id="basari">0%</span>

</div>

</div>

<script>

let data=[];
let current=0;

let puan=0;
let dogru=0;
let yanlis=0;

let mode="de-tr";

function setMode(newMode){

mode=newMode;

if(mode==="de-tr"){

document.getElementById(
"currentMode"
).innerHTML=
"Mod: 🇩🇪 → 🇹🇷";

}else{

document.getElementById(
"currentMode"
).innerHTML=
"Mod: 🇹🇷 → 🇩🇪";

}

newQuestion();

}

async function loadLevel(file){

const text =
await fetch(file).then(r=>r.text());

data=text
.split("\n")
.filter(x=>x.includes("|"))
.map(x=>x.split("|"));

document.getElementById(
"currentLevel"
).innerHTML=
"Seviye: "+
file.replace(".txt","");

newQuestion();

}

function clean(text){

return text
.toLowerCase()
.replace(/[.,!?;:]/g,"")
.trim();

}

function newQuestion(){

if(data.length===0)return;

current=
Math.floor(
Math.random()*data.length
);

if(mode==="de-tr"){

document.getElementById(
"sentence"
).innerHTML=
data[current][0];

}else{

document.getElementById(
"sentence"
).innerHTML=
data[current][1];

}

document.getElementById(
"answer"
).value="";

}

function updateStats(){

let toplam=
dogru+yanlis;

let basari=0;

if(toplam>0){

basari=
((dogru/toplam)*100)
.toFixed(1);

}

document.getElementById(
"puan"
).innerHTML=puan;

document.getElementById(
"dogru"
).innerHTML=dogru;

document.getElementById(
"yanlis"
).innerHTML=yanlis;

document.getElementById(
"basari"
).innerHTML=
basari+"%";

}

function checkAnswer(){

let cevap=
clean(
document.getElementById(
"answer"
).value
);

let dogruCevap="";

if(mode==="de-tr"){

dogruCevap=
clean(
data[current][1]
);

}else{

dogruCevap=
clean(
data[current][0]
);

}

if(cevap===dogruCevap){

puan+=10;
dogru++;

document.getElementById(
"result"
).innerHTML=
"✅ Doğru";

document.getElementById(
"result"
).style.color=
"green";

}else{

yanlis++;

document.getElementById(
"result"
).innerHTML=
"❌ Doğru cevap: "+
dogruCevap;

document.getElementById(
"result"
).style.color=
"red";

}

updateStats();

setTimeout(
newQuestion,
1500
);

}

loadLevel("a2.txt");

</script>

</body>
</html>
